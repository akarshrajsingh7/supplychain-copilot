<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1110" viewBox="0 0 1360 1110" role="img" aria-labelledby="title desc">
  <title id="title">SupplyChain Copilot — overall solution architecture</title>
  <desc id="desc">A React dashboard calls FastAPI and receives server-sent events. The incident engine invokes a Deep Agents Commander, six specialists and deterministic Python tools. LangGraph persists human approval checkpoints in SQLite. A curator validates evidence before the temporal adapter writes Graphiti and Neo4j or a local journal. LangSmith tracing is optional.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#7a98ad"/></marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#62b895"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#dce7f0}.title{font-size:29px;font-weight:700}.subtitle{font-size:14px;fill:#9db0c4}.label{font-size:12px;fill:#a9bdce}.heading{font-size:19px;font-weight:700}.body{font-size:13px;fill:#b7c9d9}.small{font-size:11px;fill:#9ab1c6}.box{fill:#132233;stroke:#38516b;stroke-width:1.5}.agent{fill:#172c31;stroke:#528b80;stroke-width:1.5}.store{fill:#24243b;stroke:#70648f;stroke-width:1.5}.edge{fill:none;stroke:#7a98ad;stroke-width:1.5;marker-end:url(#arrow)}.evidence{fill:none;stroke:#62b895;stroke-width:1.8;marker-end:url(#greenArrow)}.trace{fill:none;stroke:#ba9cce;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1360" height="1110" fill="#0a111b"/>
  <text x="50" y="54" class="title">SupplyChain Copilot</text>
  <text x="50" y="83" class="subtitle">Autonomous tariff impact and mitigation · implemented components and data flow</text>
  <text x="50" y="107" class="small">Logical boundaries: one local backend process. Dashed lines show optional cloud tracing.</text>

  <rect x="50" y="145" width="370" height="110" rx="12" class="box"/>
  <text x="72" y="177" class="heading">Human + dashboard</text>
  <text x="72" y="202" class="body">React / TypeScript / Cytoscape</text>
  <text x="72" y="225" class="small">Inject · inspect graph · approve or reject</text>
  <text x="72" y="244" class="small">Graph colors and activity are UI projections</text>

  <rect x="470" y="145" width="370" height="110" rx="12" class="box"/>
  <text x="492" y="177" class="heading">FastAPI</text>
  <text x="492" y="202" class="body">REST commands + SSE state snapshots</text>
  <text x="492" y="225" class="small">/incidents · /graph · /events · /decision</text>
  <text x="492" y="244" class="small">Local API; no hosted Agent Server</text>

  <rect x="890" y="145" width="370" height="110" rx="12" class="box"/>
  <text x="912" y="177" class="heading">Incident engine</text>
  <text x="912" y="202" class="body">Run state · evidence · event publication</text>
  <text x="912" y="225" class="small">Persists current incident JSON</text>
  <text x="912" y="244" class="small">Owns trusted episodes and tool dispatch</text>
  <path d="M420 200H470" class="edge"/>
  <path d="M840 200H890" class="edge"/>
  <text x="428" y="185" class="small">HTTP</text>
  <text x="850" y="185" class="small">calls</text>
  <path d="M1075 255V294H235V340" class="edge"/>
  <text x="565" y="285" class="label">Invoke Commander under a stable incident / thread ID</text>

  <rect x="50" y="340" width="370" height="140" rx="12" class="agent"/>
  <text x="72" y="374" class="heading">Deep Agents Commander</text>
  <text x="72" y="402" class="body">write_todos · task · approval tool</text>
  <text x="72" y="427" class="small">Scripted offline model OR ChatOpenAI</text>
  <text x="72" y="452" class="small">Delegates investigation and recovery</text>
  <text x="72" y="470" class="small">Real harness in both model modes</text>

  <rect x="470" y="340" width="370" height="140" rx="12" class="agent"/>
  <text x="492" y="374" class="heading">Six specialist subagents</text>
  <text x="492" y="402" class="body">Policy · Impact · Inventory</text>
  <text x="492" y="427" class="body">Sourcing · Planner · Risk / Critic</text>
  <text x="492" y="452" class="small">Narrow LangChain tool wrappers</text>
  <text x="492" y="470" class="small">Tool wrappers dispatch through the engine</text>

  <rect x="890" y="340" width="370" height="140" rx="12" class="agent"/>
  <text x="912" y="374" class="heading">Deterministic Python tools</text>
  <text x="912" y="402" class="body">BOM traversal · stock · landed costs</text>
  <text x="912" y="427" class="body">Capacity · lead time · plan validation</text>
  <text x="912" y="452" class="small">First proposal fails → replan → verify</text>
  <text x="912" y="470" class="small">No unrestricted Cypher tool for agents</text>
  <path d="M420 405H470" class="edge"/>
  <path d="M840 405H890" class="edge"/>
  <text x="428" y="390" class="small">task</text>
  <text x="849" y="390" class="small">tools</text>

  <rect x="50" y="610" width="370" height="140" rx="12" class="store"/>
  <text x="72" y="644" class="heading">LangGraph approval checkpoint</text>
  <text x="72" y="672" class="body">interrupt() → pause → Command(resume)</text>
  <text x="72" y="697" class="small">AsyncSqliteSaver / checkpoints.sqlite</text>
  <text x="72" y="722" class="small">Execution state, separate from business memory</text>
  <text x="72" y="740" class="small">Approve or reject via dashboard and API</text>
  <path d="M235 480V610" class="edge" marker-start="url(#arrow)"/>
  <text x="250" y="535" class="label">Pause / resume</text>
  <text x="250" y="554" class="small">Same thread ID</text>

  <rect x="470" y="610" width="370" height="140" rx="12" class="agent"/>
  <text x="492" y="644" class="heading">Graph Curator</text>
  <text x="492" y="672" class="body">Schema · source · confidence · duplicates</text>
  <text x="492" y="697" class="small">OBSERVATION / INFERENCE / DECISION</text>
  <text x="492" y="722" class="small">Decision facts require human approval</text>
  <text x="492" y="740" class="small">No purchase-order execution integration</text>
  <path d="M1040 480V535H655V610" class="evidence"/>
  <text x="690" y="526" class="label">Proposed evidence via engine</text>

  <rect x="890" y="610" width="370" height="140" rx="12" class="box"/>
  <text x="912" y="644" class="heading">TemporalMemory adapter</text>
  <text x="912" y="672" class="body">Episodes · facts · provenance · history</text>
  <text x="912" y="697" class="small">Supersede facts with valid_at / invalid_at</text>
  <text x="912" y="722" class="small">Controlled exact reads; local hash vectors</text>
  <text x="912" y="740" class="small">Optional extraction stays in staging namespace</text>
  <path d="M840 680H890" class="evidence"/>
  <path d="M1165 480V610" class="edge" marker-start="url(#arrow)"/>
  <text x="1178" y="550" class="small">Controlled</text>
  <text x="1178" y="566" class="small">reads*</text>

  <rect x="50" y="835" width="370" height="115" rx="12" class="box"/>
  <text x="72" y="869" class="heading">Committed JSON fixtures</text>
  <text x="72" y="898" class="body">68 entities · 123 relationships</text>
  <text x="72" y="922" class="small">Healthy supply chain + fixed tariff event</text>
  <text x="72" y="940" class="small">Loaded by engine; topology seeded to memory</text>

  <rect x="470" y="835" width="370" height="115" rx="12" class="store"/>
  <text x="492" y="869" class="heading">Graphiti + Neo4j</text>
  <text x="492" y="898" class="body">Business graph and temporal evidence</text>
  <text x="492" y="922" class="small">Active in MEMORY_MODE=graphiti</text>
  <text x="492" y="940" class="small">Topology is read back into supply tools</text>

  <rect x="890" y="835" width="370" height="115" rx="12" class="store"/>
  <text x="912" y="869" class="heading">SQLite memory journal</text>
  <text x="912" y="898" class="body">Episodes and curated fact records</text>
  <text x="912" y="922" class="small">Full memory fallback in local mode</text>
  <text x="912" y="940" class="small">Also tracks provenance in Graphiti mode</text>
  <path d="M1020 750V790H655V835" class="edge"/>
  <path d="M1120 750V835" class="edge"/>
  <text x="715" y="782" class="small">Graphiti mode</text>
  <text x="1134" y="800" class="small">Both modes</text>
  <path d="M420 892H470" class="edge"/>

  <rect x="50" y="1000" width="1210" height="65" rx="10" fill="#221e30" stroke="#75618a"/>
  <text x="72" y="1027" class="heading">LangSmith · optional tracing</text>
  <text x="460" y="1027" class="body">Commander → delegations → tools → rejection → replan → human resume</text>
  <text x="72" y="1050" class="small">Requires API key and network. Approval resume is a separate traced invocation correlated by incident metadata.</text>
  <path d="M50 405H25V1030H50" class="trace"/>
  <text x="50" y="1092" class="small">*Tools use a loaded topology snapshot; evidence retrieval and trusted episode writes go through the engine and memory adapter.</text>
</svg>
