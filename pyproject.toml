[project]
name = "supplychain-copilot"
version = "0.1.0"
description = "Autonomous tariff impact and mitigation with a temporal world model"
requires-python = ">=3.12,<3.13"
dependencies = [
 "deepagents==0.7.32", "graphiti-core==0.31.2", "langgraph==1.2.17",
 "langsmith==0.14.12", "langchain-openai==1.7.2", "fastapi==0.162.0",
 "uvicorn==0.54.0", "pydantic==2.14.1", "python-dotenv>=1.1,<2",
 "langgraph-checkpoint-sqlite>=3,<4",
]
[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio>=1,<2", "httpx>=0.28,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
